<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>التحقق من الشهادة | ConsuTrain</title>
  <meta name="description" content="تحقق من صحة شهادة صادرة عن منصة ConsuTrain باستخدام رمز التحقق الموجود على الشهادة.">
  <link rel="canonical" href="https://consutrain.com/certificate-verification.html">
  <meta property="og:title" content="التحقق من الشهادة | ConsuTrain">
  <meta property="og:description" content="تحقق من صحة شهادة صادرة عن منصة ConsuTrain باستخدام رمز التحقق الموجود على الشهادة.">
  <meta property="og:url" content="https://consutrain.com/certificate-verification.html">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://consutrain.com/assets/images/og/consutrain-default-og.png">
  <meta property="og:site_name" content="ConsuTrain">
  <meta property="og:locale" content="ar_MA">
  <meta property="og:locale:alternate" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="assets/css/style.css?v=20260905_certificate_verification">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0f2747">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="./assets/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">

  <style>
    .certificate-verification-page .page-hero p {
      max-width: 760px;
    }

    .verification-section {
      padding: 24px 0 72px;
    }

    .verification-card {
      max-width: 820px;
      margin-inline: auto;
      padding: clamp(22px, 4vw, 36px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .verification-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 20px;
    }

    .verification-language {
      min-width: 48px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--light);
      color: var(--primary);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .verification-language[aria-pressed="true"] {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .verification-form {
      display: grid;
      gap: 14px;
    }

    .verification-form label {
      color: var(--primary);
      font-weight: 800;
    }

    .verification-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: stretch;
    }

    .verification-form input {
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      color: var(--primary);
      font: inherit;
      direction: ltr;
      text-align: left;
      text-transform: uppercase;
    }

    .verification-form input:focus-visible,
    .verification-language:focus-visible {
      outline: 3px solid rgba(212, 166, 58, .35);
      outline-offset: 2px;
      border-color: var(--gold-2);
    }

    .verification-hint {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      direction: ltr;
      text-align: start;
    }

    .verification-status {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--light);
    }

    .verification-status[hidden] {
      display: none;
    }

    .verification-status[data-state="valid"] {
      border-color: rgba(34, 139, 94, .35);
      background: rgba(34, 139, 94, .08);
    }

    .verification-status[data-state="error"] {
      border-color: rgba(178, 57, 57, .3);
      background: rgba(178, 57, 57, .07);
    }

    .verification-status[data-state="loading"] {
      border-color: rgba(212, 166, 58, .38);
      background: rgba(212, 166, 58, .1);
    }

    .verification-status h2 {
      margin: 0;
      color: var(--primary);
      font-size: clamp(1.25rem, 3vw, 1.65rem);
    }

    .verification-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0 0;
    }

    .verification-detail {
      padding: 13px 14px;
      border: 1px solid rgba(15, 39, 71, .1);
      border-radius: 12px;
      background: rgba(255, 255, 255, .72);
    }

    .verification-detail dt {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 700;
    }

    .verification-detail dd {
      margin: 0;
      color: var(--primary);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .verification-detail--code dd {
      direction: ltr;
      text-align: start;
    }

    @media (max-width: 640px) {
      .verification-section {
        padding: 14px 0 48px;
      }

      .verification-input-row,
      .verification-details {
        grid-template-columns: 1fr;
      }

      .verification-input-row .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body class="certificate-verification-page" data-root="." data-breadcrumb-section="الشهادات" data-breadcrumb-title="التحقق من الشهادة">
  <div id="header-placeholder"></div>
  <div id="breadcrumbs-placeholder"></div>

  <main class="inner-page">
    <section class="page-hero" aria-labelledby="verification-page-title">
      <div class="container">
        <span class="eyebrow" id="verification-eyebrow">شهادات ConsuTrain</span>
        <h1 id="verification-page-title">التحقق من الشهادة</h1>
        <p id="verification-description">تحقق من صحة شهادة صادرة عن منصة ConsuTrain باستخدام رمز التحقق الموجود على الشهادة.</p>
      </div>
    </section>

    <section class="verification-section" aria-labelledby="verification-form-title">
      <div class="container">
        <div class="verification-card">
          <div class="verification-toolbar" aria-label="اختيار اللغة / Choix de la langue">
            <button class="verification-language" type="button" data-language="ar" aria-pressed="true">العربية</button>
            <button class="verification-language" type="button" data-language="fr" aria-pressed="false">FR</button>
          </div>

          <form class="verification-form" id="verificationForm" novalidate>
            <label id="verification-form-title" for="verificationCode">رمز التحقق</label>
            <div class="verification-input-row">
              <input
                id="verificationCode"
                name="code"
                type="text"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                maxlength="22"
                placeholder="CT-26-XXXX-XXXX-XXXX"
                aria-describedby="verificationHint"
                required
              >
              <button class="btn btn-primary" id="verificationSubmit" type="submit">تحقق من الشهادة</button>
            </div>
            <p class="verification-hint" id="verificationHint">CT-26-XXXX-XXXX-XXXX</p>
          </form>

          <section class="verification-status" id="verificationStatus" role="status" aria-live="polite" aria-atomic="true" hidden>
            <h2 id="verificationStatusTitle"></h2>
            <dl class="verification-details" id="verificationDetails" hidden>
              <div class="verification-detail">
                <dt id="holderNameLabel"></dt>
                <dd id="holderName"></dd>
              </div>
              <div class="verification-detail">
                <dt id="trainingTitleLabel"></dt>
                <dd id="trainingTitle"></dd>
              </div>
              <div class="verification-detail verification-detail--code">
                <dt id="certificateIdLabel"></dt>
                <dd id="certificateId"></dd>
              </div>
              <div class="verification-detail verification-detail--code">
                <dt id="verificationCodeLabel"></dt>
                <dd id="resultVerificationCode"></dd>
              </div>
              <div class="verification-detail">
                <dt id="issuedAtLabel"></dt>
                <dd id="issuedAt"></dd>
              </div>
            </dl>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="assets/js/includes.js?v=20260905_certificate_verification"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      "use strict";

      var ENDPOINT = "https://hooks.consutrain.com/webhook/consutrain-certificate-verification";
      var CODE_PATTERN = /^CT-\d{2}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
      var uiLanguage = "ar";
      var requestNumber = 0;

      var copy = {
        ar: {
          eyebrow: "شهادات ConsuTrain",
          title: "التحقق من الشهادة",
          description: "تحقق من صحة شهادة صادرة عن منصة ConsuTrain باستخدام رمز التحقق الموجود على الشهادة.",
          codeLabel: "رمز التحقق",
          button: "تحقق من الشهادة",
          loading: "جارٍ التحقق من الشهادة…",
          valid: "الشهادة صالحة",
          not_found: "لم يتم العثور على الشهادة",
          invalid_code: "رمز التحقق غير صحيح",
          revoked: "الشهادة غير صالحة",
          api_error: "تعذر التحقق الآن. يرجى المحاولة مرة أخرى لاحقًا.",
          holderName: "اسم صاحب الشهادة",
          trainingTitle: "اسم التدريب",
          certificateId: "رقم الشهادة",
          verificationCode: "رمز التحقق",
          issuedAt: "تاريخ الإصدار"
        },
        fr: {
          eyebrow: "Attestations ConsuTrain",
          title: "Vérification de l’attestation",
          description: "Vérifiez l’authenticité d’une attestation délivrée par ConsuTrain à l’aide du code de vérification figurant sur l’attestation.",
          codeLabel: "Code de vérification",
          button: "Vérifier l’attestation",
          loading: "Vérification de l’attestation…",
          valid: "Attestation valide",
          not_found: "Attestation introuvable",
          invalid_code: "Code de vérification invalide",
          revoked: "Attestation non valide",
          api_error: "La vérification est momentanément indisponible. Veuillez réessayer plus tard.",
          holderName: "Titulaire de l’attestation",
          trainingTitle: "Formation",
          certificateId: "Numéro de l’attestation",
          verificationCode: "Code de vérification",
          issuedAt: "Date de délivrance"
        }
      };

      var form = document.getElementById("verificationForm");
      var input = document.getElementById("verificationCode");
      var submit = document.getElementById("verificationSubmit");
      var statusBox = document.getElementById("verificationStatus");
      var statusTitle = document.getElementById("verificationStatusTitle");
      var details = document.getElementById("verificationDetails");
      var languageButtons = document.querySelectorAll(".verification-language");

      function setText(id, value) {
        var element = document.getElementById(id);
        if (element) element.textContent = value == null ? "" : String(value);
      }

      function normalizeLanguage(language) {
        return language === "fr" ? "fr" : "ar";
      }

      function applyComponentLanguage(language) {
        uiLanguage = normalizeLanguage(language);
        var text = copy[uiLanguage];
        var direction = uiLanguage === "fr" ? "ltr" : "rtl";

        document.querySelector(".verification-card").setAttribute("dir", direction);
        setText("verification-form-title", text.codeLabel);
        submit.textContent = text.button;
        languageButtons.forEach(function (button) {
          button.setAttribute("aria-pressed", String(button.dataset.language === uiLanguage));
        });
      }

      function applyInterfaceLanguage(language) {
        applyComponentLanguage(language);
        var text = copy[uiLanguage];

        setText("verification-eyebrow", text.eyebrow);
        setText("verification-page-title", text.title);
        setText("verification-description", text.description);
      }

      function clearResultValues() {
        ["holderName", "trainingTitle", "certificateId", "resultVerificationCode", "issuedAt"].forEach(function (id) {
          setText(id, "");
        });
      }

      function showMessage(state, message, language) {
        var resultLanguage = normalizeLanguage(language || uiLanguage);
        statusBox.hidden = false;
        statusBox.dataset.state = state;
        statusBox.setAttribute("lang", resultLanguage);
        statusBox.setAttribute("dir", resultLanguage === "fr" ? "ltr" : "rtl");
        statusTitle.textContent = message;
        details.hidden = true;
        clearResultValues();
      }

      function formatDate(value, language) {
        if (!value) return "—";
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat(language === "fr" ? "fr-FR" : "ar-MA", {
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(date);
      }

      function showValid(data) {
        var resultLanguage = normalizeLanguage(data.language);
        var text = copy[resultLanguage];
        showMessage("valid", text.valid, resultLanguage);

        setText("holderNameLabel", text.holderName);
        setText("trainingTitleLabel", text.trainingTitle);
        setText("certificateIdLabel", text.certificateId);
        setText("verificationCodeLabel", text.verificationCode);
        setText("issuedAtLabel", text.issuedAt);
        setText("holderName", data.holderName || "—");
        setText("trainingTitle", data.trainingTitle || "—");
        setText("certificateId", data.certificateId || "—");
        setText("resultVerificationCode", data.verificationCode || input.value);
        setText("issuedAt", formatDate(data.issuedAt, resultLanguage));
        details.hidden = false;
      }

      function normalizeResponse(payload) {
        if (Array.isArray(payload)) return payload[0] || {};
        return payload && typeof payload === "object" ? payload : {};
      }

      async function verifyCode(rawCode) {
        var code = String(rawCode || "").trim().toUpperCase();
        input.value = code;

        if (!CODE_PATTERN.test(code)) {
          showMessage("error", copy[uiLanguage].invalid_code, uiLanguage);
          return;
        }

        var currentRequest = ++requestNumber;
        submit.disabled = true;
        input.setAttribute("aria-busy", "true");
        showMessage("loading", copy[uiLanguage].loading, uiLanguage);

        try {
          var response = await fetch(ENDPOINT + "?code=" + encodeURIComponent(code), {
            method: "GET",
            cache: "no-store",
            headers: { "Accept": "application/json" }
          });

          if (currentRequest !== requestNumber) return;
          if (!response.ok) throw new Error("Verification request failed");

          var data = normalizeResponse(await response.json());
          var resultLanguage = normalizeLanguage(data.language || uiLanguage);
          applyComponentLanguage(resultLanguage);

          if (data.valid === true && data.status === "valid") {
            showValid(data);
          } else if (data.status === "invalid_code" || data.status === "not_found" || data.status === "revoked") {
            showMessage("error", copy[resultLanguage][data.status], resultLanguage);
          } else {
            showMessage("error", copy[resultLanguage].api_error, resultLanguage);
          }
        } catch (error) {
          if (currentRequest === requestNumber) {
            showMessage("error", copy[uiLanguage].api_error, uiLanguage);
          }
        } finally {
          if (currentRequest === requestNumber) {
            submit.disabled = false;
            input.removeAttribute("aria-busy");
          }
        }
      }

      languageButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          applyInterfaceLanguage(button.dataset.language);
          statusBox.hidden = true;
        });
      });

      input.addEventListener("input", function () {
        input.value = input.value.toUpperCase();
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        verifyCode(input.value);
      });

      applyInterfaceLanguage("ar");

      var queryCode = new URLSearchParams(window.location.search).get("code");
      if (queryCode) {
        input.value = queryCode.trim().toUpperCase();
        verifyCode(input.value);
      }
    });
  </script>
</body>
</html>
