name: Update CT-AI360 Guide PDF

on:
  workflow_dispatch:
  push:
    branches:
      - "ct-03/ct-ai360-course-guide"
    paths:
      - "assets/data/ct-ai360-course-guide.json"
      - "assets/data/platform-contact.json"
      - "scripts/generate_ct_ai360_course_guide.py"
      - "assets/images/consutrain-logo-horizontal.png"
      - "assets/fonts/Cairo-Regular.ttf"
      - "assets/fonts/Cairo-Bold.ttf"
      - ".github/workflows/update-ct-ai360-guide-pdf.yml"

permissions:
  contents: write

jobs:
  build-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "qrcode[pil]" playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/generate_ct_ai360_course_guide.py --root . --force
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads/ct-ai360/ct-ai360-program-guide-ar.pdf assets/data/ct-ai360-course-guide-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-update CT-AI360 guide PDF"
          git push origin "HEAD:${GITHUB_REF_NAME}"
